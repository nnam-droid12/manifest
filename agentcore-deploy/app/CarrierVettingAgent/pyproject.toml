[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CarrierVettingAgent"
version = "0.1.0"
description = "Manifest's Carrier Vetting & Fraud Detection Agent, hosted standalone on Bedrock AgentCore Runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "boto3 >= 1.35.0",
    "strands-agents >= 1.15.0",
    "openai >= 1.50.0",
    "aws-bedrock-token-generator >= 1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
