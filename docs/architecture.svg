<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1160" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1360" height="1160" fill="#f4f5f7"/>

  <!-- Title -->
  <text x="40" y="42" font-size="26" font-weight="700" fill="#0b2e4f">Manifest — Architecture</text>
  <text x="40" y="66" font-size="13" fill="#64748b">Strands Agents SDK swarm, deployed on Amazon Bedrock AgentCore</text>

  <!-- Layer: Human + Dashboard -->
  <g>
    <rect x="40" y="90" width="220" height="60" rx="10" fill="#0b2e4f"/>
    <text x="150" y="115" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Human Broker</text>
    <text x="150" y="134" font-size="11" fill="#cbd5e1" text-anchor="middle">approves / rejects / adjusts</text>

    <rect x="320" y="90" width="360" height="60" rx="10" fill="#fff" stroke="#0b2e4f" stroke-width="1.5"/>
    <text x="500" y="112" font-size="13" font-weight="600" fill="#0b2e4f" text-anchor="middle">Broker Dashboard (Next.js)</text>
    <text x="500" y="130" font-size="11" fill="#64748b" text-anchor="middle">Audit trail · Approvals · Analytics — S3 + CloudFront, Cognito auth</text>

    <rect x="740" y="90" width="580" height="60" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
    <text x="1030" y="112" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Amazon Cognito · CloudWatch (agent action logs)</text>
    <text x="1030" y="130" font-size="11" fill="#64748b" text-anchor="middle">Broker identity · every agent action logged with reasoning + confidence</text>
  </g>
  <line x1="260" y1="120" x2="320" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="120" x2="740" y2="120" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Layer: Orchestrator -->
  <rect x="320" y="180" width="360" height="70" rx="10" fill="#0b2e4f"/>
  <text x="500" y="208" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Orchestrator Agent</text>
  <text x="500" y="227" font-size="11" fill="#cbd5e1" text-anchor="middle">Bedrock AgentCore Runtime + Memory — autonomy gate</text>
  <text x="500" y="242" font-size="10" fill="#93c5fd" text-anchor="middle">enforced in code: HIGH risk never reaches outreach</text>
  <line x1="500" y1="150" x2="500" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="250" x2="500" y2="278" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer: Agent swarm grid -->
  <text x="40" y="300" font-size="14" font-weight="700" fill="#0b2e4f">Agent Swarm — independent Strands Agents, own tools, own model choice</text>

  <!-- helper grid: 5 columns x 2 rows, boxes 250x84, gaps 10 -->
  <!-- Row 1 -->
  <g font-size="11.5">
    <rect x="40" y="318" width="250" height="86" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="165" y="340" font-weight="600" fill="#0b2e4f" text-anchor="middle">Load-Matching</text>
    <text x="165" y="357" fill="#64748b" text-anchor="middle" font-size="10.5">search_load_board</text>
    <text x="165" y="371" fill="#64748b" text-anchor="middle" font-size="10.5">get_load_detail</text>
    <text x="165" y="388" fill="#94a3b8" text-anchor="middle" font-size="9.5">Nova Act (browser) — Playwright stand-in</text>

    <rect x="300" y="318" width="250" height="86" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="425" y="340" font-weight="600" fill="#0b2e4f" text-anchor="middle">Carrier Vetting &amp; Fraud</text>
    <text x="425" y="357" fill="#64748b" text-anchor="middle" font-size="10.5">lookup_carrier_by_mc/dot</text>
    <text x="425" y="371" fill="#64748b" text-anchor="middle" font-size="10.5">get_broker_carrier_record · search_playbook</text>
    <text x="425" y="388" fill="#94a3b8" text-anchor="middle" font-size="9.5">FMCSA SAFER (public, real) — gates outreach</text>

    <rect x="560" y="318" width="250" height="86" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="685" y="340" font-weight="600" fill="#0b2e4f" text-anchor="middle">Rate Intelligence</text>
    <text x="685" y="357" fill="#64748b" text-anchor="middle" font-size="10.5">compute_rate_stats</text>
    <text x="685" y="371" fill="#64748b" text-anchor="middle" font-size="10.5">get_market_conditions</text>
    <text x="685" y="388" fill="#94a3b8" text-anchor="middle" font-size="9.5">real stats over DynamoDB rate history</text>

    <rect x="820" y="318" width="250" height="86" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="945" y="340" font-weight="600" fill="#0b2e4f" text-anchor="middle">Carrier Outreach</text>
    <text x="945" y="357" fill="#64748b" text-anchor="middle" font-size="10.5">send_rate_offer</text>
    <text x="945" y="371" fill="#64748b" text-anchor="middle" font-size="10.5">ceiling enforced in code</text>
    <text x="945" y="388" fill="#94a3b8" text-anchor="middle" font-size="9.5">Bedrock Guardrails secondary check</text>

    <rect x="1080" y="318" width="240" height="86" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="1200" y="340" font-weight="600" fill="#0b2e4f" text-anchor="middle">Document Extraction</text>
    <text x="1200" y="357" fill="#64748b" text-anchor="middle" font-size="10.5">extract_document_fields</text>
    <text x="1200" y="371" fill="#64748b" text-anchor="middle" font-size="10.5">reconciles vs. agreed terms</text>
    <text x="1200" y="388" fill="#94a3b8" text-anchor="middle" font-size="9.5">Amazon Textract (real)</text>
  </g>

  <!-- Row 2 -->
  <g font-size="11.5">
    <rect x="40" y="416" width="250" height="86" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="165" y="438" font-weight="600" fill="#0b2e4f" text-anchor="middle">Cargo Condition</text>
    <text x="165" y="455" fill="#64748b" text-anchor="middle" font-size="10.5">compare_cargo_photos</text>
    <text x="165" y="469" fill="#64748b" text-anchor="middle" font-size="10.5">pickup vs. delivery</text>
    <text x="165" y="486" fill="#94a3b8" text-anchor="middle" font-size="9.5">Amazon Nova Pro (multimodal)</text>

    <rect x="300" y="416" width="250" height="86" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="425" y="438" font-weight="600" fill="#0b2e4f" text-anchor="middle">Track-and-Trace</text>
    <text x="425" y="455" fill="#64748b" text-anchor="middle" font-size="10.5">check_shipment_status</text>
    <text x="425" y="469" fill="#64748b" text-anchor="middle" font-size="10.5">delay-significance reasoning</text>
    <text x="425" y="486" fill="#94a3b8" text-anchor="middle" font-size="9.5">EventBridge-scheduled polling</text>

    <rect x="560" y="416" width="250" height="86" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="685" y="438" font-weight="600" fill="#0b2e4f" text-anchor="middle">Customer Update</text>
    <text x="685" y="455" fill="#64748b" text-anchor="middle" font-size="10.5">check_shipment_status</text>
    <text x="685" y="469" fill="#64748b" text-anchor="middle" font-size="10.5">plain-language shipper updates</text>
    <text x="685" y="486" fill="#94a3b8" text-anchor="middle" font-size="9.5">triggered by Track-and-Trace or milestone</text>

    <rect x="820" y="416" width="250" height="86" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="945" y="438" font-weight="600" fill="#0b2e4f" text-anchor="middle">Voice Check-In</text>
    <text x="945" y="455" fill="#64748b" text-anchor="middle" font-size="10.5">conduct_voice_checkin</text>
    <text x="945" y="469" fill="#64748b" text-anchor="middle" font-size="10.5">status by phone, not just email</text>
    <text x="945" y="486" fill="#94a3b8" text-anchor="middle" font-size="9.5">Amazon Connect · Polly · Transcribe</text>

    <rect x="1080" y="416" width="240" height="86" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="1200" y="438" font-weight="600" fill="#0b2e4f" text-anchor="middle">Playbook &amp; Lane-History</text>
    <text x="1200" y="455" fill="#64748b" text-anchor="middle" font-size="10.5">search_playbook</text>
    <text x="1200" y="469" fill="#64748b" text-anchor="middle" font-size="10.5">institutional memory (RAG)</text>
    <text x="1200" y="486" fill="#94a3b8" text-anchor="middle" font-size="9.5">Bedrock Knowledge Bases</text>
  </g>

  <!-- connectors from orchestrator down to grid -->
  <line x1="500" y1="250" x2="165" y2="318" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="500" y1="250" x2="425" y2="318" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="500" y1="250" x2="685" y2="318" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="500" y1="250" x2="945" y2="318" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="500" y1="250" x2="1200" y2="318" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Layer: Model + Trust layer -->
  <text x="40" y="536" font-size="14" font-weight="700" fill="#0b2e4f">Model &amp; Trust Layer</text>
  <g font-size="11.5">
    <rect x="40" y="552" width="300" height="66" rx="8" fill="#eef2ff" stroke="#818cf8"/>
    <text x="190" y="576" font-weight="600" fill="#312e81" text-anchor="middle">Claude (Bedrock) · Amazon Nova Pro</text>
    <text x="190" y="594" fill="#4338ca" text-anchor="middle" font-size="10">reasoning, negotiation, orchestration, vision</text>

    <rect x="360" y="552" width="300" height="66" rx="8" fill="#eef2ff" stroke="#818cf8"/>
    <text x="510" y="576" font-weight="600" fill="#312e81" text-anchor="middle">Amazon Nova Act</text>
    <text x="510" y="594" fill="#4338ca" text-anchor="middle" font-size="10">browser-automation engine for load boards / portals</text>

    <rect x="680" y="552" width="300" height="66" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="830" y="576" font-weight="600" fill="#78350f" text-anchor="middle">Bedrock Guardrails</text>
    <text x="830" y="594" fill="#92400e" text-anchor="middle" font-size="10">outreach ceiling/PII checks — deployed, live-verified</text>

    <rect x="1000" y="552" width="320" height="66" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="1160" y="576" font-weight="600" fill="#78350f" text-anchor="middle">Bedrock Knowledge Bases</text>
    <text x="1160" y="594" fill="#92400e" text-anchor="middle" font-size="10">OpenSearch Serverless vector store · Titan Embeddings</text>
  </g>

  <!-- Layer: Supporting AWS services -->
  <text x="40" y="660" font-size="14" font-weight="700" fill="#0b2e4f">Supporting AWS Services</text>
  <g font-size="11">
    <rect x="40" y="676" width="195" height="56" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="137" y="700" font-weight="600" fill="#334155" text-anchor="middle">DynamoDB</text>
    <text x="137" y="716" fill="#64748b" text-anchor="middle" font-size="9.5">loads · carriers · shipments · rates · audit log</text>

    <rect x="250" y="676" width="195" height="56" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="347" y="700" font-weight="600" fill="#334155" text-anchor="middle">S3</text>
    <text x="347" y="716" fill="#64748b" text-anchor="middle" font-size="9.5">documents · cargo photos · playbook source</text>

    <rect x="460" y="676" width="195" height="56" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="557" y="700" font-weight="600" fill="#334155" text-anchor="middle">EventBridge</text>
    <text x="557" y="716" fill="#64748b" text-anchor="middle" font-size="9.5">Track-and-Trace polling schedule</text>

    <rect x="670" y="676" width="195" height="56" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="767" y="700" font-weight="600" fill="#334155" text-anchor="middle">Amazon Textract</text>
    <text x="767" y="716" fill="#64748b" text-anchor="middle" font-size="9.5">rate confirmations · BOLs</text>

    <rect x="880" y="676" width="195" height="56" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="977" y="700" font-weight="600" fill="#334155" text-anchor="middle">Connect · Polly · Transcribe</text>
    <text x="977" y="716" fill="#64748b" text-anchor="middle" font-size="9.5">outbound voice check-ins</text>

    <rect x="1090" y="676" width="230" height="56" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="1205" y="700" font-weight="600" fill="#334155" text-anchor="middle">FMCSA SAFER (external, public)</text>
    <text x="1205" y="716" fill="#64748b" text-anchor="middle" font-size="9.5">real carrier registry — not mocked</text>
  </g>

  <!-- Legend / status note -->
  <rect x="40" y="760" width="1280" height="150" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <text x="60" y="788" font-size="13" font-weight="700" fill="#0b2e4f">Current deployment status (see README for the full, current picture)</text>
  <text x="60" y="812" font-size="11.5" fill="#334155">• All agents above are real, independently-tested Strands Agents — verified live this session, not stubbed.</text>
  <text x="60" y="832" font-size="11.5" fill="#334155">• This account's Bedrock on-demand invocation quota (Claude, Nova, Titan Embeddings) is held at 0 pending an AWS Support case —</text>
  <text x="76" y="850" font-size="11.5" fill="#334155">reasoning agents run against a Bedrock Mantle stand-in model until it clears; Guardrails is unaffected and genuinely live.</text>
  <text x="60" y="870" font-size="11.5" fill="#334155">• The Orchestrator is deployed to Bedrock AgentCore Runtime (CodeZip) with real FMCSA / rate-history / playbook / Guardrails tools.</text>
  <text x="60" y="890" font-size="11.5" fill="#334155">• Load-board/carrier-portal browser tools use Playwright locally as the Nova Act stand-in (mock sites aren't reachable from AgentCore's network).</text>

  <text x="1320" y="1145" font-size="9" fill="#94a3b8" text-anchor="end">docs/architecture.svg</text>
</svg>
